services:
  # ======================= Supporting Services =======================
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: cine_vision
      PG_DATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: unless-stopped

  mongodb:
    container_name: mongodb
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=rootuser
      - MONGO_INITDB_ROOT_PASSWORD=rootpass

  mongo-express:
    container_name: mongo-express
    image: mongo-express
    restart: always
    ports:
      - "8091:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=rootuser
      - ME_CONFIG_MONGODB_ADMINPASSWORD=rootpass
      - ME_CONFIG_MONGODB_SERVER=mongodb

  zookeeper:
    container_name: zookeeper
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"

  kafka:
    container_name: kafka
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
    depends_on:
      - zookeeper

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:18.0.2
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8181:8080"
    command:
      - start-dev

  zipkin:
    container_name: zipkin
    image: openzipkin/zipkin
    ports:
      - "9411:9411"

  redis:
    container_name: redis
    image: redis
    ports:
      - "6379:6379"

  # ======================= Backend / Frontend =======================
  eureka-server:
    build: ./eureka-server
    image: cinevision-eureka-server
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    image: cinevision-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  userService:
    build: ./userService
    image: cinevision-user-service
    ports:
      - "8082:8082"
    depends_on:
      - eureka-server

  movieService:
    build: ./movieService
    image: cinevision-movie-service
    ports:
      - "8081:8081"
    depends_on:
      - eureka-server

  emailService:
    build: ./emailService
    image: cinevision-email-service
    ports:
      - "8083:8083"
    depends_on:
      - eureka-server

  frontend:
    build: ./frontend
    image: cinevision-frontend
    ports:
      - "3000:80"

networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  data:
